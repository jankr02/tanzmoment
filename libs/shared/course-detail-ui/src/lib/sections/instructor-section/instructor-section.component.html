<section class="instructor-section" aria-label="Kursleitung">
  <div class="instructor-section__container">

    <!-- Section Headline -->
    <h2 class="instructor-section__headline">Deine Kursleiterin</h2>

    <!-- Instructor Card -->
    <div class="instructor-section__card">

      <!-- Portrait -->
      <div class="instructor-section__portrait">
        <img
          [src]="imageUrl"
          [alt]="'Portrait of ' + fullName"
          class="instructor-section__image"
          loading="lazy"
        />
      </div>

      <!-- Info -->
      <div class="instructor-section__info">

        <!-- Name -->
        <h3 class="instructor-section__name">{{ fullName }}</h3>

        <!-- Qualifications Tags -->
        @if (hasQualifications) {
          <div class="instructor-section__qualifications" role="list" aria-label="Qualifications">
            @for (q of qualifications; track q) {
              <span class="instructor-section__tag" role="listitem">{{ q }}</span>
            }
          </div>
        }

        <!-- Bio -->
        @if (bio) {
          <p class="instructor-section__bio">{{ bio }}</p>
        }

        <!-- Quote -->
        @if (quote) {
          <blockquote class="instructor-section__quote">
            <p>&bdquo;{{ quote }}&ldquo;</p>
          </blockquote>
        }

      </div>
    </div>

  </div>
</section>
