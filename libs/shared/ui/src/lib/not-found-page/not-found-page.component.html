<main class="not-found">
  <div class="not-found__container">
    <p class="not-found__code">404</p>
    <h1 class="not-found__headline">Diese Seite tanzt woanders</h1>
    <p class="not-found__text">
      Die Seite, die du suchst, gibt es nicht (mehr). Vielleicht hat sie nur
      ihren Platz gewechselt – lass uns zurück zum Anfang finden.
    </p>
    <div class="not-found__actions">
      <app-button variant="primary" size="large" (clicked)="onHomeClick()">
        Zur Startseite
      </app-button>
      <app-button variant="secondary" size="large" (clicked)="onCoursesClick()">
        Kurse entdecken
      </app-button>
    </div>
  </div>
</main>
