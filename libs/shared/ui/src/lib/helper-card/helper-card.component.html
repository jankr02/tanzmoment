<!-- ============================================================================
  HELPER CARD TEMPLATE ("path stop")

  Structure:
  - Large, slightly rotated hand-drawn illustration with warm elevation
  - Title + description
  - Understated underlined CTA link with trailing arrow
============================================================================ -->

<div class="helper-card__illustration" aria-hidden="true">
  <img
    [src]="card().illustration"
    [alt]="card().alt"
    class="helper-card__image"
    loading="lazy"
  />
</div>

<h3 class="helper-card__title">
  {{ card().title }}
</h3>

@if (showSubtitle() && card().subtitle) {
<p class="helper-card__subtitle">
  {{ card().subtitle }}
</p>
}

<span class="helper-card__cta">
  {{ ctaText }}
  <span class="helper-card__cta-arrow" aria-hidden="true">→</span>
</span>
