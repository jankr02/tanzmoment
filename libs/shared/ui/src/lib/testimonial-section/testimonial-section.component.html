<section class="voices">
  <div class="voices__wrap">
    <h2 class="voices__headline">{{ data.headline }}</h2>

    @let active = data.testimonials[activeIndex()];

    <figure
      class="voices__stage"
      role="tabpanel"
      [attr.aria-labelledby]="'voice-tab-' + activeIndex()"
      [style.--voice-accent]="accentVar(active)"
    >
      <span class="voices__mark" aria-hidden="true">&ldquo;</span>
      <blockquote class="voices__quote">{{ active.quote }}</blockquote>
      <figcaption class="voices__attribution">
        <span class="voices__rule" aria-hidden="true"></span>
        <span class="voices__name">{{ active.author }}</span>
        @if (active.context) {
          <span class="voices__role">{{ active.context }}</span>
        }
      </figcaption>
    </figure>

    <div class="voices__pager" role="tablist" aria-label="Stimmen auswählen">
      @for (testimonial of data.testimonials; track testimonial.id) {
        <button
          #tab
          type="button"
          role="tab"
          class="voices__tab"
          [class.is-active]="activeIndex() === $index"
          [id]="'voice-tab-' + $index"
          [attr.aria-selected]="activeIndex() === $index"
          [attr.tabindex]="activeIndex() === $index ? 0 : -1"
          [style.--voice-accent]="accentVar(testimonial)"
          (mouseenter)="select($index)"
          (click)="select($index)"
          (keydown)="onKeydown($event, $index)"
        >
          <span class="voices__dot" aria-hidden="true"></span>
          <span class="voices__tab-name">{{ testimonial.author }}</span>
        </button>
      }
    </div>
  </div>
</section>
