<main class="about-page">
  <!-- Decorative blob field: page-wide layer behind the section content (above
       backgrounds, below text) so blobs flow across the wave dividers. The two
       shared sections (dance-styles, testimonials) are cover islands. -->
  <div class="about-page__blobs" aria-hidden="true">
    <tm-decorative-blob variant="organic-1" [position]="null" top="6%" right="3%" [size]="380" [rotation]="18" />
    <tm-decorative-blob variant="organic-4" [position]="null" top="12%" left="2%" [size]="300" [rotation]="-35" [flip]="true" />
    <tm-decorative-blob variant="organic-2" [position]="null" top="19%" right="6%" [size]="340" [rotation]="60" />
    <tm-decorative-blob variant="organic-6" [position]="null" top="25%" left="4%" [size]="400" [rotation]="120" [flip]="true" />
    <tm-decorative-blob variant="organic-3" [position]="null" top="31%" right="4%" [size]="300" [rotation]="-20" />
    <tm-decorative-blob variant="organic-5" [position]="null" top="37%" left="3%" [size]="360" [rotation]="40" [flip]="true" />
    <tm-decorative-blob variant="organic-2" [position]="null" top="43%" right="5%" [size]="280" [rotation]="-50" />
    <tm-decorative-blob variant="organic-1" [position]="null" top="48%" left="5%" [size]="320" [rotation]="200" [flip]="true" />
    <tm-decorative-blob variant="organic-6" [position]="null" top="86%" left="3%" [size]="300" [rotation]="15" />
    <tm-decorative-blob variant="organic-3" [position]="null" top="88%" right="4%" [size]="300" [rotation]="90" [flip]="true" />
    <tm-decorative-blob variant="organic-5" [position]="null" top="93%" left="4%" [size]="360" [rotation]="-25" />
  </div>

  <!-- Hero: personal introduction -->
  <tm-hero-section [data]="heroData()" />

  <!-- Origin: story timeline + mission/vision values -->
  <tm-origin-section [data]="originData()" />

  <!-- Transition: Origin (surface) -> Values (background) -->
  <tm-wave-divider from="surface" to="background" variant="organic" height="md" />

  <!-- Values -->
  <tm-values-section [data]="valuesData()" />

  <!-- Transition: Values (background) -> Approach (surface) -->
  <tm-wave-divider from="background" to="surface" variant="organic" height="md" />

  <!-- Approach -->
  <tm-approach-section [data]="approachData()" />

  <!-- Transition: Approach (surface) -> Spaces (background) -->
  <tm-wave-divider from="surface" to="background" variant="organic" height="md" />

  <!-- Spaces & Accessibility -->
  <tm-spaces-section [data]="spacesData()" />

  <!-- Transition: Spaces (background) -> Dance Styles (surface).
       Desktop only: the section is white on desktop but sits directly on the
       beige neighbours on mobile, where the journey renders its own waves. -->
  <tm-wave-divider class="about-page__wave--desktop-only" from="background" to="surface" variant="organic" height="md" />

  <!--
    Dance Styles Section (navigates to the sub-pages).
    On mobile the journey's own top/bottom waves are the section edges, so
    prev/next = "background" matches the beige neighbours (spaces / testimonials).
  -->
  <ui-dance-styles-section
    headline="Für wen ist Tanzmoment?"
    subheadline="Entdecke, ob unsere Kurse zu deiner Lebenssituation passen"
    [danceStyles]="danceStyles()"
    [navigationMode]="'navigate'"
    [showCourseCounts]="false"
    previousSectionBackground="background"
    nextSectionBackground="background"
  />

  <!-- Transition: Dance Styles (surface) -> Testimonials (background). Desktop only (see above). -->
  <tm-wave-divider class="about-page__wave--desktop-only" from="surface" to="background" variant="organic" height="md" />

  <!-- Testimonials (shared dance-style "voices" design) -->
  <ui-testimonial-section [data]="testimonialsData()" />

  <!-- Transition: Testimonials (background) -> FAQ (surface) -->
  <tm-wave-divider from="background" to="surface" variant="organic" height="md" />

  <!-- FAQ -->
  <tm-faq-section [data]="faqData()" />

  <!-- Contact (same background as FAQ: no wave needed) -->
  <tm-contact-section [data]="contactData()" />
</main>
