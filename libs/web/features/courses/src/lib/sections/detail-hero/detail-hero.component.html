<section class="detail-hero" role="banner">
  <!-- Background Image -->
  <div class="detail-hero__image-wrapper">
    <img
      [src]="imageUrl"
      [alt]="headline + ' – ' + danceStyleLabel"
      class="detail-hero__image"
      loading="eager"
      fetchpriority="high"
    />
    <!-- Gradient overlay for text readability -->
    <div class="detail-hero__overlay" aria-hidden="true"></div>
  </div>

  <!-- Content Overlay -->
  <div class="detail-hero__content" [style.color]="textColor">
    <div class="detail-hero__container">

      <!-- Dance Style Badge -->
      <span class="detail-hero__badge">
        {{ danceStyleLabel }}
      </span>

      <!-- Headline (H1 — only one H1 per page) -->
      <h1 class="detail-hero__title">{{ headline }}</h1>

      <!-- Sub-Headline -->
      @if (subHeadline) {
        <p class="detail-hero__subtitle">{{ subHeadline }}</p>
      }

    </div>
  </div>

  <!-- Wave Bottom Border -->
  <div class="detail-hero__wave" aria-hidden="true">
    <svg
      viewBox="0 0 1440 120"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"
        fill="var(--detail-bg)"
      />
    </svg>
  </div>
</section>
