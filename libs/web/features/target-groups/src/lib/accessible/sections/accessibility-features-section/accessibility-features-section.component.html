<section class="accessibility-features">
  <!-- Hand-drawn border filter (applied to each card outline) -->
  <svg class="accessibility-features__defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="tm-sketch-border">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="accessibility-features__container">
    <header class="accessibility-features__header">
      <h2 class="accessibility-features__headline">{{ data.headline }}</h2>
      <p class="accessibility-features__subheadline">{{ data.subheadline }}</p>
    </header>

    <div class="accessibility-features__grid">
      @for (feature of data.features; track $index) {
        <article
          class="accessibility-features__card"
          [ngClass]="'accessibility-features__card--tint-' + ($index % 3)"
        >
          <span class="accessibility-features__badge">
            <span
              class="accessibility-features__icon"
              [style.--feature-icon]="iconVar(feature.icon)"
            ></span>
          </span>

          <p class="accessibility-features__kicker">{{ feature.kicker }}</p>
          <h3 class="accessibility-features__title">{{ feature.title }}</h3>
          <p class="accessibility-features__description">{{ feature.description }}</p>

          <button
            type="button"
            class="accessibility-features__toggle"
            [attr.aria-expanded]="isOpen($index)"
            (click)="toggle($index)"
          >
            <span>Mehr erfahren</span>
            <svg
              class="accessibility-features__chevron"
              [class.is-open]="isOpen($index)"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>

          @if (isOpen($index)) {
            <p class="accessibility-features__details">{{ feature.details }}</p>
          }
        </article>
      }
    </div>
  </div>
</section>
