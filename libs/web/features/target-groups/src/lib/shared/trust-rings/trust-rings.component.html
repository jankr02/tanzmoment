<section class="rings-section">
  <div class="rings-section__wrap">
    <header class="rings-section__head">
      <h2 class="rings-section__headline">{{ theme().heading }}</h2>
      <p class="rings-section__sub">{{ theme().sub }}</p>
    </header>

    <div class="rings-section__board">
      <!-- Concentric protective rings -->
      <svg
        class="rings-section__rings"
        viewBox="0 0 440 440"
        role="img"
        [attr.aria-label]="summaryLabel()"
      >
        @for (i of ringOrder; track i) {
          <circle
            class="rings-section__ring"
            [attr.cx]="cx"
            [attr.cy]="cy"
            [attr.r]="radii[i]"
            fill="none"
            [attr.stroke]="theme().ramp[i]"
            [attr.stroke-width]="ringStrokeWidth(i)"
            [style.opacity]="ringOpacity(i)"
            (mouseenter)="select(i)"
            (click)="select(i)"
          />
        }

        <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="coreRadius" [attr.fill]="theme().ramp[0]" />

        <g
          class="rings-section__core-icon"
          [attr.transform]="coreTransform"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (group()) {
            @case ('kids') {
              <circle cx="11.5" cy="5.4" r="2.4" />
              <path d="M11.5 7.8 V14" />
              <path d="M11.5 10 L7.6 6.9" />
              <path d="M11.5 10 L15.4 6.9" />
              <path d="M11.5 14 L8.6 19" />
              <path d="M11.5 14 L14.4 19" />
              <path d="M18.6 4.2 V7.2" />
              <path d="M17.1 5.7 H20.1" />
            }
            @case ('ausdruck') {
              <circle cx="13.4" cy="4.9" r="2.2" />
              <path d="M13 7 C12.2 9.4 10.6 10.6 9.6 13.4" />
              <path d="M12.2 9 C14 7 16 5.6 18.6 5.1" />
              <path d="M12.2 9 C10.6 9.8 9.3 10.2 8 9.2" />
              <path d="M9.6 13.4 L11.6 20" />
              <path d="M9.6 13.4 C8 15.4 6 16.4 4.9 19" />
            }
            @case ('muetter') {
              <circle cx="8.4" cy="5.4" r="2.3" />
              <path d="M8.4 7.7 V15" />
              <path d="M8.4 15 L6.7 20" />
              <path d="M8.4 15 L10.1 20" />
              <path d="M8.4 11 C10.4 12 11.7 12.2 12.9 13" />
              <circle cx="15.4" cy="11" r="1.7" />
              <path d="M15.4 12.7 V17" />
              <path d="M15.4 17 L14.1 20" />
              <path d="M15.4 17 L16.7 20" />
              <path d="M15.4 14 L14 13" />
            }
            @case ('behinderung') {
              <circle cx="11.4" cy="4.7" r="2.1" />
              <path d="M11.4 6.8 L10.4 12" />
              <path d="M11 9 L14.6 5.4" />
              <path d="M10.4 12 L14 13.6" />
              <path d="M14 13.6 L14.6 17" />
              <circle cx="9" cy="16.4" r="4" />
              <circle cx="15.1" cy="18.4" r="1.3" />
            }
          }
        </g>

        <!-- Numbered markers at 12 o'clock per ring -->
        @for (r of radii; track $index) {
          <g
            class="rings-section__marker"
            (mouseenter)="select($index)"
            (click)="select($index)"
          >
            <circle
              [attr.cx]="cx"
              [attr.cy]="markerY($index)"
              r="13"
              fill="var(--color-surface)"
              [attr.stroke]="theme().ramp[$index]"
              [attr.stroke-width]="activeLayer() === $index ? 2.5 : 1.5"
            />
            <text
              class="rings-section__marker-num"
              [attr.x]="cx"
              [attr.y]="markerY($index) + 4.5"
              text-anchor="middle"
              [attr.fill]="theme().ramp[$index]"
            >
              {{ $index + 1 }}
            </text>
          </g>
        }
      </svg>

      <!-- Layers legend (tablist) -->
      <div class="rings-section__legend" role="tablist" aria-label="Schutzschichten">
        @for (layer of theme().layers; track layer.title) {
          <div
            #row
            class="rings-section__row"
            [class.is-active]="activeLayer() === $index"
            role="tab"
            [id]="'layer-tab-' + $index"
            [attr.aria-selected]="activeLayer() === $index"
            [attr.tabindex]="activeLayer() === $index ? 0 : -1"
            (mouseenter)="select($index)"
            (click)="select($index)"
            (keydown)="onKeydown($event, $index)"
          >
            <div class="rings-section__row-head">
              <span
                class="rings-section__badge"
                aria-hidden="true"
                [style.background]="theme().ramp[$index]"
              >
                {{ $index + 1 }}
              </span>
              <span class="rings-section__layer-title">{{ layer.title }}</span>
            </div>
            <div
              class="rings-section__desc-wrap"
              role="tabpanel"
              [attr.aria-labelledby]="'layer-tab-' + $index"
            >
              <p class="rings-section__desc">{{ layer.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Safety band: outermost layer of protection, shared across audiences -->
    <div class="rings-section__band" [style.background]="theme().tint">
      <span class="rings-section__seal" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="34"
          height="34"
          fill="none"
          [attr.stroke]="theme().ramp[0]"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="10" r="6" />
          <path d="M9 9.8l2 2 3.4-3.6" />
          <path d="M9 15.5L7.5 21l4.5-2.4L16.5 21 15 15.5" />
        </svg>
      </span>
      <p class="rings-section__band-text">
        <strong [style.color]="theme().ramp[0]">Geprüft &amp; geschult:</strong>
        {{ guarantee }}
      </p>
    </div>
  </div>
</section>
