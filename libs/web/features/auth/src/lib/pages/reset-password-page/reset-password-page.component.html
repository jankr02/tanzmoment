<tm-auth-layout title="Neues Passwort wählen">
  @if (success()) {
    <div class="auth-form__success-banner" role="status">
      Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt anmelden.
    </div>
    <div class="auth-form__state-card">
      <a routerLink="/auth/login">Zum Login →</a>
    </div>
  } @else if (!token()) {
    <div class="auth-form__error-banner" role="alert">
      {{ errorMessage() }}
    </div>
    <div class="auth-form__state-card">
      <a routerLink="/auth/forgot-password">Neuen Link anfordern</a>
    </div>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="auth-form__error-banner" role="alert">
          {{ errorMessage() }}
          <div style="margin-top: 8px;">
            <a routerLink="/auth/forgot-password">Neuen Link anfordern →</a>
          </div>
        </div>
      }

      <app-input
        id="password"
        type="password"
        label="Neues Passwort"
        placeholder="Mindestens 8 Zeichen"
        formControlName="password"
        [required]="true"
        [showPasswordToggle]="true"
        [hasError]="!!passwordError"
        [errorMessage]="passwordError ?? ''"
      />

      <app-input
        id="passwordConfirm"
        type="password"
        label="Passwort bestätigen"
        placeholder="Passwort wiederholen"
        formControlName="passwordConfirm"
        [required]="true"
        [showPasswordToggle]="true"
        [hasError]="!!passwordConfirmError"
        [errorMessage]="passwordConfirmError ?? ''"
      />

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
        class="auth-form__submit"
      >
        Passwort speichern
      </app-button>
    </form>
  }
</tm-auth-layout>
