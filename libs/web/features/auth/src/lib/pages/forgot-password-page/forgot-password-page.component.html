<tm-auth-layout
  title="Passwort vergessen?"
  subtitle="Wir schicken dir einen Link zum Zurücksetzen deines Passworts."
>
  @if (submitted()) {
    <div class="auth-form__success-banner" role="status">
      Falls ein Konto mit dieser E-Mail existiert, haben wir dir einen Link zum Zurücksetzen gesendet.
      Bitte prüfe auch deinen Spam-Ordner.
    </div>
    <div class="auth-form__state-card">
      <a routerLink="/auth/login">← Zurück zum Login</a>
    </div>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="auth-form__error-banner" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <app-input
        id="email"
        type="email"
        label="E-Mail-Adresse"
        placeholder="deine@email.de"
        formControlName="email"
        [required]="true"
        [hasError]="emailControl.invalid && emailControl.touched"
        errorMessage="Bitte gib eine gültige E-Mail-Adresse ein."
      />

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
        class="auth-form__submit"
      >
        Link senden
      </app-button>
    </form>

    <div auth-footer>
      <a routerLink="/auth/login">← Zurück zum Login</a>
    </div>
  }
</tm-auth-layout>
