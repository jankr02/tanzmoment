<section class="account">
  <ui-page-header eyebrow="Mein Bereich" [title]="'Hallo ' + displayName()">
    <span class="account__avatar" aria-hidden="true">{{ initials() }}</span>
  </ui-page-header>

  <nav class="account__tabs" aria-label="Konto-Navigation">
    @for (tab of tabs; track tab.route) {
      <a
        class="account__tab"
        [routerLink]="tab.route"
        routerLinkActive="account__tab--active"
      >
        {{ tab.label }}
      </a>
    }
  </nav>

  <div class="account__content">
    <router-outlet />
  </div>
</section>
