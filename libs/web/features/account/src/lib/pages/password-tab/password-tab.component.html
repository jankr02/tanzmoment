<section class="card" aria-labelledby="password-title">
  <header class="card__header">
    <h2 id="password-title">Passwort ändern</h2>
    <p class="card__subtitle">
      Mindestens 8 Zeichen, eine Zahl und ein Großbuchstabe.
    </p>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (error(); as err) {
      <p class="form__banner form__banner--error" role="alert">{{ err }}</p>
    }
    <p class="form__notice">
      Nach erfolgreicher Änderung wirst du aus Sicherheitsgründen ausgeloggt
      und musst dich mit dem neuen Passwort neu anmelden.
    </p>

    <app-input
      id="pw-current"
      type="password"
      label="Aktuelles Passwort"
      formControlName="currentPassword"
      [required]="true"
      [showPasswordToggle]="true"
      autocomplete="current-password"
      [hasError]="currentControl().invalid && currentControl().touched"
      errorMessage="Aktuelles Passwort ist erforderlich."
    />

    <app-input
      id="pw-new"
      type="password"
      label="Neues Passwort"
      formControlName="newPassword"
      [required]="true"
      [showPasswordToggle]="true"
      autocomplete="new-password"
      [hasError]="newControl().invalid && newControl().touched"
      errorMessage="Mindestens 8 Zeichen, eine Zahl und einen Großbuchstaben."
    />

    <app-input
      id="pw-confirm"
      type="password"
      label="Neues Passwort bestätigen"
      formControlName="confirmPassword"
      [required]="true"
      [showPasswordToggle]="true"
      autocomplete="new-password"
      [hasError]="confirmControl().touched && form.hasError('passwordMismatch')"
      errorMessage="Die Passwörter stimmen nicht überein."
    />

    <div class="form__actions">
      <app-button
        type="submit"
        variant="primary"
        [loading]="saving()"
        [disabled]="saving()"
      >
        Passwort ändern
      </app-button>
    </div>
  </form>
</section>
