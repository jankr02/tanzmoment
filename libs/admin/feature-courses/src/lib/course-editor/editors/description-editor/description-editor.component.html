<div class="ed">
  <label class="ed-field">
    <span class="ed-field__label">Überschrift</span>
    <input
      class="ed-field__control"
      type="text"
      [(ngModel)]="headline"
      (ngModelChange)="emit()"
    />
  </label>

  <div class="ed-field">
    <span class="ed-field__label">Beschreibungstext</span>
    <admin-rich-text-editor
      [html]="description"
      placeholder="Beschreibe den Kurs…"
      (htmlChange)="onDescriptionChange($event)"
    />
  </div>

  <admin-image-upload-field
    [value]="imageUrl"
    label="Bild (Beschreibung)"
    (valueChange)="onImg($event)"
  />

  <label class="ed-field">
    <span class="ed-field__label">Bild-Alt-Text</span>
    <input
      class="ed-field__control"
      type="text"
      [(ngModel)]="imageAlt"
      (ngModelChange)="emit()"
    />
  </label>

  <label class="ed-field">
    <span class="ed-field__label">Bildposition</span>
    <select
      class="ed-field__control"
      [(ngModel)]="imagePosition"
      (ngModelChange)="emit()"
    >
      <option value="left">Links</option>
      <option value="right">Rechts</option>
    </select>
  </label>

  <p class="ed__subtitle">Zielgruppe</p>

  <label class="ed-field">
    <span class="ed-field__label">Überschrift</span>
    <input
      class="ed-field__control"
      type="text"
      [(ngModel)]="targetAudienceHeadline"
      (ngModelChange)="emit()"
    />
  </label>

  <label class="ed-field">
    <span class="ed-field__label">Text</span>
    <textarea
      class="ed-field__control"
      [(ngModel)]="targetAudienceBody"
      (ngModelChange)="emit()"
    ></textarea>
  </label>

  <p class="ed__subtitle">Highlights</p>

  @for (highlight of highlights; track i; let i = $index) {
    <div class="ed-row">
      <div class="ed-row__body">
        <input
          class="ed-field__control"
          type="text"
          placeholder="Highlight-Text"
          [(ngModel)]="highlight.text"
          (ngModelChange)="emit()"
        />
      </div>
      <div class="ed-row__actions">
        <button
          type="button"
          class="ed-btn ed-btn--remove"
          (click)="removeHighlight(i)"
        >
          Entfernen
        </button>
      </div>
    </div>
  }

  <button type="button" class="ed-btn ed-btn--add" (click)="addHighlight()">
    + Highlight
  </button>
</div>
