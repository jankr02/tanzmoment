<div class="rte">
  <div class="rte__toolbar" role="toolbar" aria-label="Textformatierung">
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['bold']" (click)="toggleBold()" aria-label="Fett"><strong>B</strong></button>
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['italic']" (click)="toggleItalic()" aria-label="Kursiv"><em>I</em></button>
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['heading']" (click)="toggleHeading()" aria-label="Zwischenüberschrift">H</button>
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['bulletList']" (click)="toggleBulletList()" aria-label="Aufzählung">•</button>
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['orderedList']" (click)="toggleOrderedList()" aria-label="Nummerierte Liste">1.</button>
    <button type="button" class="rte__btn" [class.rte__btn--active]="activeMarks()['link']" (click)="setLink()" aria-label="Link">🔗</button>
  </div>
  <div #editorEl class="rte__content"></div>
</div>
