<div class="ed">
  <label class="ed-field">
    <span class="ed-field__label">Bio (Override)</span>
    <textarea
      class="ed-field__control"
      [(ngModel)]="bioOverride"
      (ngModelChange)="emit()"
    ></textarea>
  </label>

  <label class="ed-field">
    <span class="ed-field__label">Zitat</span>
    <textarea
      class="ed-field__control"
      [(ngModel)]="quote"
      (ngModelChange)="emit()"
    ></textarea>
  </label>

  <admin-image-upload-field
    [value]="imageOverride"
    label="Bild (Override)"
    (valueChange)="onImg($event)"
  />

  <p class="ed__subtitle">Qualifikationen</p>

  @for (q of qualifications; track i; let i = $index) {
    <div class="ed-row">
      <div class="ed-row__body">
        <input
          class="ed-field__control"
          type="text"
          [(ngModel)]="qualifications[i]"
          (ngModelChange)="emit()"
        />
      </div>
      <div class="ed-row__actions">
        <button
          type="button"
          class="ed-btn ed-btn--remove"
          (click)="removeQualification(i)"
        >
          Entfernen
        </button>
      </div>
    </div>
  }

  <button
    type="button"
    class="ed-btn ed-btn--add"
    (click)="addQualification()"
  >
    + Qualifikation
  </button>
</div>
