<div class="step" [formGroup]="form">
  <div class="field-row">
    <div class="field">
      <label class="field__label" for="priceInEuros">Preis in Euro</label>
      <input
        id="priceInEuros"
        type="number"
        formControlName="priceInEuros"
        class="field__input"
        step="0.01"
        min="0"
        placeholder="0,00"
      />
    </div>

    <div class="field" style="align-self: flex-end; padding-bottom: 8px;">
      <label class="checkbox">
        <input type="checkbox" formControlName="isFree" (change)="onFreeToggle()" />
        <span>Kostenlos</span>
      </label>
    </div>
  </div>

  @if (
    !form.get('isFree')?.value &&
    form.get('priceInEuros')?.touched &&
    (form.get('priceInEuros')?.value ?? 0) <= 0
  ) {
    <span class="field__error">
      Bitte gib einen Preis ein oder markiere den Kurs als „Kostenlos".
    </span>
  }

  <div class="field-row">
    <div class="field">
      <label class="field__label" for="duration">Dauer (Minuten)</label>
      <select id="duration" formControlName="duration" class="field__select">
        @for (d of durations; track d) {
          <option [value]="d">{{ d }} Min.</option>
        }
      </select>
    </div>

    <div class="field">
      <label class="field__label" for="maxParticipants">Max. Teilnehmer</label>
      <input
        id="maxParticipants"
        type="number"
        formControlName="maxParticipants"
        class="field__input"
        min="1"
      />
    </div>
  </div>

  <div class="field">
    <label class="field__label">Buchungsmodus</label>
    <div class="radio-group">
      <label class="radio">
        <input type="radio" formControlName="bookingMode" value="FULL_COURSE" />
        <span>Ganzer Kurs</span>
      </label>
      <label class="radio">
        <input type="radio" formControlName="bookingMode" value="SINGLE_SESSION" />
        <span>Einzelsession</span>
      </label>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label class="field__label" for="visibility">Sichtbarkeit</label>
      <select id="visibility" formControlName="visibility" class="field__select">
        @for (opt of visibilityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="field" style="align-self: flex-end; padding-bottom: 8px;">
      <label class="checkbox">
        <input type="checkbox" formControlName="isMarkedAsHighlighted" />
        <span>Hervorgehoben</span>
      </label>
    </div>
  </div>

</div>
