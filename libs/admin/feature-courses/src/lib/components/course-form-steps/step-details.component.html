<div class="step" [formGroup]="form">
  <div class="field">
    <label class="field__label" for="description">Ausführliche Beschreibung</label>
    <textarea
      id="description"
      formControlName="description"
      class="field__textarea"
      rows="8"
      placeholder="Beschreibe den Kursinhalt, was die Teilnehmer erwartet..."
    ></textarea>
    @if (form.get('description')?.touched && form.get('description')?.hasError('required')) {
      <span class="field__error">Bitte gib eine Beschreibung ein</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="catchPhrase">Catchphrase</label>
    <input
      id="catchPhrase"
      type="text"
      formControlName="catchPhrase"
      class="field__input"
      placeholder="z.B. Mein Tipp für alle, die sich frei bewegen wollen"
    />
    <span class="field__hint">Optional — wird auf der Kursseite prominent angezeigt</span>
  </div>

  <div class="field">
    <label class="field__label" for="imageUrl">Bild-URL</label>
    <input
      id="imageUrl"
      type="url"
      formControlName="imageUrl"
      class="field__input"
      placeholder="https://..."
    />
    <span class="field__hint">Optional — Link zum Kursbild</span>
  </div>
</div>
