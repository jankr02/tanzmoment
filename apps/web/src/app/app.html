<!-- Global Header (hidden during splash screen on landing page) -->
@if (shouldShowHeaderFooter()) {
  <tm-header
    [isAuthenticated]="isAuthenticated()"
    [userData]="userMenuData()"
    (loginClicked)="onLoginClicked()"
    (registerClicked)="onRegisterClicked()"
  />
}

<!-- Main Application Container -->
<main>
  <router-outlet></router-outlet>
</main>

<!-- Global Footer (hidden during splash screen on landing page) -->
@if (shouldShowHeaderFooter()) {
  <tm-footer
    [waveFrom]="footerColors().from"
    [waveTo]="footerColors().to"
    [style.--footer-bg-color]="footerColors().bg"
  />
}
